name: Daily collector

on:
  schedule:
    - cron: '0 4 * * *'   # kl. 06 dansk tid
    - cron: '0 10 * * *'  # kl. 12 dansk tid
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - run: python collector_daily.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          AGSI_KEY: ${{ secrets.AGSI_KEY }}
